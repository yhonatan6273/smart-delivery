# docker-compose.test.yml

services:
  test-db:
    image: postgres:16
    env_file:
      - ./backend/.env.test.docker
    ports:
      - "5433:5432" 

  test-kafka:
    image: lensesio/fast-data-dev:latest
    ports:
      - "9092:9092"          #kafka Broker for tests
      - "8081:8081"          #schema registry for tests
    environment:
      ADV_HOST: localhost   
      RUN_AS_USER: "root"
      TOPIC_RECREATE: "1"