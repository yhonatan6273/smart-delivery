apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-statefulset
spec:
  serviceName: "postgres"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16.4-alpine3.20 
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: app-config
          #this is used for sensitive data from Secrets
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
            #this is the path inside the container where the persistent storage will be available
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      ##specifies the type of access to the volume
      spec:
        accessModes: [ "ReadWriteOnce" ]
        #specifies the amount of resources being requested
        resources:
          requests:
            storage: 1Gi