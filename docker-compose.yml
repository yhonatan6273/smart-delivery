#the main services that define the containers
services:
  fast-data-dev:
    image: lensesio/fast-data-dev:latest
    container_name: kafka-dev-box
    ports:
      - "9092:9092"    # kafka broker
      - "8081:8081"    # schema registry
      - "8082:8082"    # kafka connect
      - "8083:8083"    # kafka connect
      - "3030:3030"    # lenses ui
    environment:
      #hostname
      ADV_HOST: fast-data-dev  
      #access as root user      
      RUN_AS_USER: "root" 
      #allows topic recreation            
      TOPIC_RECREATE: "1"  
    #check if the service is healthy by pinging the schema registry endpoint           
    healthcheck:
      test: ["CMD", "curl", "-f", "http://fast-data-dev:8081"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 180s

  consumer:
    #build the image using the Dockerfile in the current directory
    build: .
    container_name: smart-delivery-consumer
    #
    restart: unless-stopped
    #make sure the consumer starts only after the database and kafka are healthy
    depends_on:
      postgres:
        condition: service_healthy
      fast-data-dev:
        condition: service_healthy
    env_file:
      - ./.env.docker 
    #map the current directory to /usr/src/app in the container
    volumes: ["./:/usr/src/app"]
    #set the PYTHONUNBUFFERED environment variable to ensure real-time logging
    environment:
      PYTHONUNBUFFERED: 1
    #run the consumer script
    command: python -m src.kafka.consumer

  
  akhq:
    image: tchiotludo/akhq:latest
    container_name: akhq
    ports:
      - "8080:8080"
    environment:
    #set the AKHQ CONFIGURATION to connect to the Kafka broker and schema registry
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            docker-kafka-cluster:
              properties:
                bootstrap.servers: "fast-data-dev:9092" 
              schema-registry:
                url: "http://fast-data-dev:8081"     
    depends_on:
      fast-data-dev:
        condition: service_healthy
      

  src:
    build: .
    container_name: smart-delivery-api
    depends_on:
      postgres:
        condition: service_healthy
      fast-data-dev:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./:/usr/src/app
    env_file:
      - ./.env.docker

    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

    

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    #check if the service is started and healthy by using pg_isready command
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    #this ensures that all database data is saved persistently, even if the container is removed.
    volumes:
      - postgres_data:/var/lib/postgresql/data
   

volumes:
  postgres_data: