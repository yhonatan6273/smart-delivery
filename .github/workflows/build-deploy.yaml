name: build and deploy code

on: [push, pull_request, workflow_dispatch]
    
jobs:
  #this job is for quick static and application tests  
  #to see if there are any obvious issues before building and pushing the docker image
  linting:
    name: linting and validation
    runs-on: ubuntu-latest

    steps:
      - name: pulling git repo
        uses: actions/checkout@v5
        with: 
          #pull LFS files (like ML models)
          lfs: true

      #check the dockerfile for any issues
      - name: lint dockerfile
        run: docker run --rm -v "$(pwd):/work" -w /work hadolint/hadolint hadolint backend/Dockerfile

      #check the kubernetes files for any issues
      - name: validate kubernetes YAMLs
        uses: docker://ghcr.io/yannh/kubeconform:v0.7.0
        with:
          entrypoint: '/kubeconform'
          args: >
            -summary
            -strict
            -ignore-filename-pattern kustomization.yaml
            backend/k8s/
  #this job is to run quick tests on the application with the test services (api, db, kafka,ML)
  integration_tests:
    name: setup and run all tests
    runs-on: ubuntu-latest
    environment: Testing
    steps:
      - name: pulling git repo
        uses: actions/checkout@v5
        with: 
          lfs: true

      - name: Force Git LFS Pull
        run: git lfs pull

     
      - name: Create .env.test.docker from secrets
        run: |
          cat <<EOF> .env.test.docker
          
          POSTGRES_USER=${{ secrets.POSTGRES_USER_TEST }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD_TEST }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB_TEST }}
          POSTGRES_HOSTNAME=test-db
          POSTGRES_PORT=5432
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          ALGORITHM=${{ secrets.ALGORITHM }}
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
          KAFKA_BOOTSTRAP_SERVERS=test-kafka:9092
          SCHEMA_REGISTRY_URL=http://test-kafka:8081
          ACCESS_TOKEN_EXPIRE_MINUTES=${{secrets.ACCESS_TOKEN_EXPIRE_MINUTES}}
          KAFKA_TOPIC_REQUESTS=${{secrets.KAFKA_TOPIC_REQUESTS_TEST}}
          KAFKA_TOPIC_RESULT=${{secrets.KAFKA_TOPIC_RESULT_TEST}}
          EOF
      - name: Run Application Tests
        run: docker compose -f docker-compose.test.yml up --build --exit-code-from runner

      - name: Run ML Specific Tests
      
        run: docker compose -f docker-compose.test.yml run runner pytest -v -m "ml" tests

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
       
  #this job is for building and smoke testing and pushing the docker image and he is depend on the success of the previous jobs      
  build_and_push:
    name: build, smoke Test, and push
    runs-on: ubuntu-latest
    #the dependency on the previous jobs
    needs: [linting, integration_tests]
    env:
      POSTGRES_PORT: 5432
      POSTGRES_HOSTNAME: localhost
      POSTGRES_DB: ${{secrets.POSTGRES_DB}} 
      POSTGRES_USER: ${{secrets.POSTGRES_USER}}
      POSTGRES_PASSWORD: ${{secrets.POSTGRES_PASSWORD}}
      SECRET_KEY: ${{secrets.SECRET_KEY}}
      ALGORITHM: ${{secrets.ALGORITHM}}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${{secrets.ACCESS_TOKEN_EXPIRE_MINUTES}}
      GOOGLE_API_KEY: ${{secrets.GOOGLE_API_KEY}}
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      KAFKA_TOPIC_REQUESTS: ${{secrets.KAFKA_TOPIC_REQUESTS}}
      KAFKA_TOPIC_RESULT: ${{secrets.KAFKA_TOPIC_RESULT}}
      SCHEMA_REGISTRY_URL: http://localhost:8081
    services:
      postgres:
        image: postgres

        env:
          POSTGRES_PASSWORD: ${{secrets.POSTGRES_PASSWORD}} 
          POSTGRES_DB: ${{secrets.POSTGRES_DB}}
          POSTGRES_USER: ${{secrets.POSTGRES_USER}}

        ports:
          - 5432:5432 

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      kafka-stack:
        image: lensesio/fast-data-dev:latest
        ports:
          - 9092:9092 
          - 8081:8081 
          
        env:
          ADV_HOST: localhost 
          RUN_AS_USER: "root"
          TOPIC_RECREATE: "1"

        options: >-
          --health-cmd "curl -f -s http://localhost:8081/subjects"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15 
          --health-start-period 30s 
    
    steps:
      - name: pulling git repo
        uses: actions/checkout@v5
        with: 
          lfs: true
      #giving the full tag name to the docker image based on the docker hub username variable
      - name: extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKER_USERNAME }}/smart-delivery

      - name: log in to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

        #build and load but don't push yet
      - name: build and load Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          load: true 
          push: false 
          tags: ${{ steps.meta.outputs.tags }}


      #smoke test will run the container and check if the /docs endpoint is reachable and nothing crashes
      - name: run smoke test
        run: |
          echo "starting container with all environment variables."
          docker run -d --name smart-delivery-test --network host \
            -e POSTGRES_PORT=${POSTGRES_PORT} \
            -e POSTGRES_HOSTNAME=${POSTGRES_HOSTNAME} \
            -e POSTGRES_DB=${POSTGRES_DB} \
            -e POSTGRES_USER=${POSTGRES_USER} \
            -e POSTGRES_PASSWORD=${POSTGRES_PASSWORD} \
            -e SECRET_KEY=${SECRET_KEY} \
            -e ALGORITHM=${ALGORITHM} \
            -e ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES} \
            -e GOOGLE_API_KEY=${GOOGLE_API_KEY} \
            -e KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS} \
            -e KAFKA_TOPIC_REQUESTS=${KAFKA_TOPIC_REQUESTS} \
            -e KAFKA_TOPIC_RESULT=${KAFKA_TOPIC_RESULT} \
            -e SCHEMA_REGISTRY_URL=${SCHEMA_REGISTRY_URL} \
            ${{ steps.meta.outputs.tags }}
          echo "waiting for application to become healthy at http://localhost:8000/docs"
          timeout=90
          
          while ! curl -s -f http://localhost:8000/docs > /dev/null; do
            timeout=$((timeout-5))
            if [ $timeout -le 0 ]; then
              echo "error: Timed out waiting for application."
              echo "container logs (smart-delivery-test) are:"
              docker logs smart-delivery-test
              exit 1
            fi
            echo "still waiting ($timeout seconds left)"
            sleep 5
          done
          
          echo "application is healthy! smoke test passed"

      #if we got to this stage we can now push
      - name: push docker image to docker hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ${{ steps.meta.outputs.tags }}