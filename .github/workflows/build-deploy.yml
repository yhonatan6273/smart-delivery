name: build and deploy code

on: [push, pull_request]
    
jobs:
  build:
    environment:
      name: testing
    env:
      POSTGRES_PORT: 5432
      POSTGRES_HOSTNAME: localhost
      POSTGRES_DB: ${{secrets.POSTGRES_DB}}
      POSTGRES_USER: ${{secrets.POSTGRES_USER}}
      POSTGRES_PASSWORD: ${{secrets.POSTGRES_PASSWORD}}
      SECRET_KEY: ${{secrets.SECRET_KEY}}
      ALGORITHM: ${{secrets.ALGORITHM}}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${{secrets.ACCESS_TOKEN_EXPIRE_MINUTES}}
      GOOGLE_API_KEY: ${{secrets.GOOGLE_API_KEY}}
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      KAFKA_TOPIC_CALCULATE_ROUTE: ${{secrets.KAFKA_TOPIC_CALCULATE_ROUTE}}
      KAFKA_CONSUMER_GROUP: ${{secrets.KAFKA_CONSUMER_GROUP}}
      SCHEMA_REGISTRY_URL: http://localhost:8081

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: ${{secrets.POSTGRES_PASSWORD}} 
          POSTGRES_DB: ${{secrets.POSTGRES_DB}}_test
        ports:
          - 5432:5432
        #set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      kafka:
        image: confluentinc/cp-kafka:latest
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
          KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
          KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
          KAFKA_PROCESS_ROLES: 'broker,controller'
          KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
          KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
          CLUSTER_ID: 'SQwXA7BtSL6CKmsooAqGwA'
      schema-registry: 
        image: confluentinc/cp-schema-registry:latest
        ports:
          - 8081:8081
        env:
          SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:9092'
          SCHEMA_REGISTRY_HOST_NAME: 'schema-registry'
          SCHEMA_REGISTRY_LISTENERS: 'http://0.0.0.0:8081'


    runs-on: ubuntu-latest
    steps:
      - name: pulling git repo
        uses: actions/checkout@v5
        with: 
          lfs: true

      - name: Lint dockerfile
        run: docker run --rm -v "$(pwd):/work" -w /work hadolint/hadolint hadolint Dockerfile

      - name: install python version 3.12.8
        uses: actions/setup-python@v6 
        with:
          python-version: '3.12.8'

      - name: update pip
        run: python -m pip install --upgrade pip

      - name: install all dependencies
        run: pip install -r requirements.txt
      - name: Run Tests with Pytest
        timeout-minutes: 2
        run: |
          echo "waiting for services"
          
          echo "1. waiting for Postgres (5432)"
          while ! nc -z localhost 5432; do sleep 0.1; done;
          echo "Postgres is UP!"

          echo "2. waiting for Kafka (9092)"
          while ! nc -z localhost 9092; do sleep 0.1; done;
          echo "Kafka is UP!"

          echo "3. waiting for Schema Registry (8081)"
          while ! nc -z localhost 8081; do sleep 0.1; done;
          echo "Schema Registry is UP!"

          echo "all services are up! Running tests"
          pytest
      - name: Debug Container Logs
        if: always()
        run: |
          echo "docker container status"
          docker ps -a
          echo "kafka container logs "
          docker logs $(docker ps -a --filter "ancestor=confluentinc/cp-kafka" --format "{{.ID}}") || echo "Kafka logs not found."

          echo "Schema Registry logs"
          docker logs $(docker ps -a --filter "ancestor=confluentinc/cp-schema-registry" --format "{{.ID}}") || echo "Schema Registry logs not found."

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKER_USERNAME }}/smart-delivery

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
       
      - name: Run smoke test
        run: |
          docker run -d --name smart-delivery-test -p 8000:8000 ${{ steps.meta.outputs.tags }}
          sleep 15
          curl -f http://localhost:8000/docs || exit 1

      - name: Push Docker Image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ${{ steps.meta.outputs.tags }}