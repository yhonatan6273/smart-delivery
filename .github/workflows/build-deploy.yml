name: build and deploy code

on: [push, pull_request]
    
jobs:
  build:
    environment:
      name: testing
    env:
      POSTGRES_PORT: 5432
      POSTGRES_HOSTNAME: localhost
      POSTGRES_DB: ${{secrets.POSTGRES_DB}}
      POSTGRES_USER: ${{secrets.POSTGRES_USER}}
      POSTGRES_PASSWORD: ${{secrets.POSTGRES_PASSWORD}}
      SECRET_KEY: ${{secrets.SECRET_KEY}}
      ALGORITHM: ${{secrets.ALGORITHM}}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${{secrets.ACCESS_TOKEN_EXPIRE_MINUTES}}
      GOOGLE_API_KEY: ${{secrets.GOOGLE_API_KEY}}
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      KAFKA_TOPIC_CALCULATE_ROUTE: ${{secrets.KAFKA_TOPIC_CALCULATE_ROUTE}}
      KAFKA_CONSUMER_GROUP: ${{secrets.KAFKA_CONSUMER_GROUP}}
      SCHEMA_REGISTRY_URL: http://localhost:8081

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: ${{secrets.POSTGRES_PASSWORD}} 
          POSTGRES_DB: ${{secrets.POSTGRES_DB}}_test
        ports:
          - 5432:5432
        #set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      kafka-stack:
        image: lensesio/fast-data-dev:latest
        ports:
          - 9092:9092  # Kafka Broker
          - 8081:8081  # Schema Registry
        env:
          ADV_HOST: localhost 
          RUN_AS_USER: "root"
          TOPIC_RECREATE: "1"

        options: >-
          --health-cmd "curl -f -s http://localhost:8081/subjects"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15 
          --health-start-period 30s 

    runs-on: ubuntu-latest
    steps:
      - name: pulling git repo
        uses: actions/checkout@v5
        with: 
          lfs: true

      - name: lint dockerfile
        run: docker run --rm -v "$(pwd):/work" -w /work hadolint/hadolint hadolint Dockerfile

      - name: Validate Kubernetes YAMLs
        uses: docker://ghcr.io/yannh/kubeconform:v0.7.0 
        with:
          entrypoint: '/kubeconform'
          args: > 
            -summary
            -strict
            ./k8s/
          
      - name: install python version 3.12.8
        uses: actions/setup-python@v6 
        with:
          python-version: '3.12.8'

      - name: update pip
        run: python -m pip install --upgrade pip

      - name: install all dependencies
        run: pip install -r requirements.txt

      - name: run Tests with Pytest
        timeout-minutes: 4
        run: |
          echo "all services are healthy running tests."
          pytest

      - name: debug Container Logs
        if: failure()
        run: |
          echo "docker container status"
          docker ps -a
          
          echo "kafka Stack (fast-data-dev) container logs "
          docker logs $(docker ps -a --filter "ancestor=lensesio/fast-data-dev" --format "{{.ID}}") || echo "kafka Stack logs not found."

          echo "postgres container logs"
          docker logs $(docker ps -a --filter "ancestor=postgres" --format "{{.ID}}") || echo "Postgres logs not found."
          
          
      - name: extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKER_USERNAME }}/smart-delivery

      - name: log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: build and load Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
       #smoke test will run the container and check if the /docs endpoint is reachable
      - name: Run Smoke Test
        run: |
          echo "starting container with all environment variables."
          docker run -d --name smart-delivery-test -p 8000:8000 \
            -e POSTGRES_PORT=${POSTGRES_PORT} \
            -e POSTGRES_HOSTNAME=${POSTGRES_HOSTNAME} \
            -e POSTGRES_DB=${POSTGRES_DB} \
            -e POSTGRES_USER=${POSTGRES_USER} \
            -e POSTGRES_PASSWORD=${POSTGRES_PASSWORD} \
            -e SECRET_KEY=${SECRET_KEY} \
            -e ALGORITHM=${ALGORITHM} \
            -e ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES} \
            -e GOOGLE_API_KEY=${GOOGLE_API_KEY} \
            -e KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS} \
            -e KAFKA_TOPIC_CALCULATE_ROUTE=${KAFKA_TOPIC_CALCULATE_ROUTE} \
            -e KAFKA_CONSUMER_GROUP=${KAFKA_CONSUMER_GROUP} \
            -e SCHEMA_REGISTRY_URL=${SCHEMA_REGISTRY_URL} \
            ${{ steps.meta.outputs.tags }}
          echo "waiting for application to become healthy at http://localhost:8000/docs"
          timeout=90
          
          while ! curl -s -f http://localhost:8000/docs > /dev/null; do
            timeout=$((timeout-5))
            if [ $timeout -le 0 ]; then
              echo "error: Timed out waiting for application."
              echo "container logs (smart-delivery-test) are:"
              docker logs smart-delivery-test
              exit 1
            fi
            echo "still waiting ($timeout seconds left)"
            sleep 5
          done
          
          echo "application is healthy! smoke test passed"
          

      - name: push Docker Image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ${{ steps.meta.outputs.tags }}